<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>포트폴리오 인터뷰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --surface-2:#F7F8F4;
  --ink:#191E19; --muted:#5D6A60; --faint:#8A968D;
  --line:#DDE2D8; --line-strong:#C4CCBF;
  --accent:#186B46; --accent-ink:#0E4E32; --accent-soft:#DFEDE4;
  --flag:#8A5A12; --flag-soft:#F4EEDF;
  --shadow:0 1px 2px rgba(25,30,25,.05), 0 10px 28px -20px rgba(25,30,25,.45);
  --serif:"Gowun Batang", "Nanum Myeongjo", serif;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141713; --surface:#1B1F19; --surface-2:#22271F;
    --ink:#E8EDE5; --muted:#A2AE9F; --faint:#7E8B7F;
    --line:#2E342B; --line-strong:#414A3D;
    --accent:#5FC48D; --accent-ink:#93DCB1; --accent-soft:#1E3628;
    --flag:#D8AE68; --flag-soft:#2D2618;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#141713; --surface:#1B1F19; --surface-2:#22271F;
  --ink:#E8EDE5; --muted:#A2AE9F; --faint:#7E8B7F;
  --line:#2E342B; --line-strong:#414A3D;
  --accent:#5FC48D; --accent-ink:#93DCB1; --accent-soft:#1E3628;
  --flag:#D8AE68; --flag-soft:#2D2618;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:400}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}

/* ---------- shell ---------- */
.wrap{max-width:860px; margin:0 auto; padding-inline:18px}

.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding-block:14px 10px}
.brand{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:-.01em}
.brand-sub{font-size:12.5px; color:var(--muted)}
.count{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:10px}
.bar > i{display:block; height:100%; width:0%; background:var(--accent); transition:width .35s ease}

.steps{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 74px); z-index:29;
  background:var(--bg); border-bottom:1px solid var(--line)}
.steps-in{display:flex; gap:6px; overflow-x:auto; padding-block:9px; scrollbar-width:thin}
.step{flex:0 0 auto; display:flex; align-items:center; gap:7px; border:1px solid var(--line);
  background:var(--surface); border-radius:999px; padding:5px 13px 5px 10px; font-size:13px; color:var(--muted);
  white-space:nowrap; transition:.15s}
.step:hover{border-color:var(--line-strong)}
.step .dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:0 0 auto}
.step[data-done="1"] .dot{background:var(--accent)}
.step[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--bg)}
.step[aria-current="true"] .dot{background:var(--bg)}

main{padding-block:26px 40px}

/* ---------- section ---------- */
.sec-head{margin-bottom:22px}
.sec-kicker{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px}
.sec-title{font-family:var(--serif); font-size:clamp(25px,5.4vw,33px); font-weight:700; letter-spacing:-.02em; line-height:1.25}
.sec-lede{margin-top:9px; color:var(--muted); font-size:14.5px; max-width:60ch}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}

/* ---------- question ---------- */
.q{padding:18px 20px; border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-head{display:flex; gap:11px; align-items:flex-start}
.q-num{font-family:var(--mono); font-size:11.5px; color:var(--faint); padding-top:4px; flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.q-text{font-size:15.5px; font-weight:500; line-height:1.5; display:block}
.q-body{margin-top:9px; margin-left:26px}
@media (max-width:520px){ .q-body{margin-left:0} }
.q-hint{font-size:13px; color:var(--muted); margin-top:5px; max-width:58ch}
.q-ex{font-size:12.5px; color:var(--flag); margin-top:7px; padding-left:9px;
  border-left:2px solid color-mix(in srgb, var(--flag) 40%, transparent); max-width:60ch}

input[type=text], textarea, select{
  width:100%; background:var(--surface-2); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px; line-height:1.6; transition:.14s;}
textarea{resize:vertical; min-height:44px}
input[type=text]:focus, textarea:focus, select:focus{
  outline:none; border-color:var(--accent); background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent)}
::placeholder{color:var(--faint)}

.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  padding:6px 13px; font-size:13.5px; color:var(--muted); transition:.14s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent);
  color:var(--accent-ink); font-weight:500}

/* ---------- rows / repeat ---------- */
.rows{display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:8px; align-items:center}
.row > *:first-child{flex:1 1 auto; min-width:0}
.row .grow{flex:1 1 auto; min-width:0}
.row .narrow{flex:0 0 150px; min-width:0}
@media (max-width:520px){
  .row{flex-wrap:wrap}
  .row .narrow{flex:1 1 120px}
}
.xbtn{flex:0 0 auto; width:30px; height:30px; border:1px solid var(--line); background:var(--surface-2);
  border-radius:7px; color:var(--faint); line-height:1; font-size:15px}
.xbtn:hover{color:#B33; border-color:#B33}
.add{margin-top:10px; border:1px dashed var(--line-strong); background:transparent; color:var(--accent);
  border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:500}
.add:hover{background:var(--accent-soft); border-style:solid}

.card{border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); overflow:hidden}
.card + .card{margin-top:18px}
.card-top{display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--accent-soft);
  border-bottom:1px solid var(--line)}
.card-name{font-family:var(--serif); font-weight:700; font-size:16px; color:var(--accent-ink)}
.card-top .xbtn{margin-left:auto; background:transparent}

.note{background:var(--flag-soft); border:1px solid color-mix(in srgb, var(--flag) 30%, transparent);
  border-radius:10px; padding:13px 15px; font-size:13.5px; color:var(--ink); line-height:1.6}
.note b{color:var(--flag); font-weight:600}
.note + .panel, .note + .note{margin-top:16px}
.panel + .note{margin-top:16px}

.navrow{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap}
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:9px;
  padding:10px 18px; font-size:14px; font-weight:500}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-ink); color:#fff}
.btn.ghost{border-style:dashed; color:var(--muted); font-weight:400}
.navrow .right{margin-left:auto}

/* ---------- preview paper ---------- */
.paper{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); padding:34px 32px; margin-top:16px}
@media (max-width:520px){ .paper{padding:24px 18px} }
.pf-name{font-family:var(--serif); font-size:31px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
.pf-intro{font-size:17px; color:var(--ink); margin-top:8px; max-width:50ch; line-height:1.55}
.pf-meta{margin-top:13px; display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted)}
.pf-meta a{color:var(--accent-ink)}
.pf-sec{margin-top:34px; padding-top:22px; border-top:1px solid var(--line)}
.pf-h{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:16px}
.pf-item + .pf-item{margin-top:26px; padding-top:22px; border-top:1px dashed var(--line)}
.pf-title{font-family:var(--serif); font-size:19px; font-weight:700; line-height:1.35}
.pf-when{font-family:var(--mono); font-size:12px; color:var(--faint); margin-top:3px;
  font-variant-numeric:tabular-nums}
.pf-block{margin-top:12px; display:grid; grid-template-columns:78px 1fr; gap:4px 14px; align-items:baseline}
@media (max-width:520px){ .pf-block{grid-template-columns:1fr; gap:2px 0} .pf-lab{margin-top:8px} }
.pf-lab{font-size:12px; color:var(--accent); font-weight:600; letter-spacing:.02em}
.pf-val{font-size:14.5px; line-height:1.7; white-space:pre-wrap}
.pf-val ul{margin:0; padding-left:18px}
.pf-val li{margin:2px 0}
.pf-quote{font-family:var(--serif); font-size:18px; line-height:1.6; padding:16px 20px;
  background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; margin:6px 0 18px}
.pf-defs{display:grid; gap:12px}
.pf-def dt{font-size:12px; color:var(--accent); font-weight:600; margin-bottom:2px}
.pf-def dd{margin:0; font-size:14.5px; line-height:1.65; white-space:pre-wrap}
.pf-tools{display:flex; flex-wrap:wrap; gap:8px}
.pf-tool{display:inline-flex; align-items:baseline; gap:7px; border:1px solid var(--line);
  border-radius:999px; padding:5px 13px; font-size:13.5px; background:var(--surface-2)}
.pf-tool small{font-size:11px; color:var(--accent); font-family:var(--mono)}
.pf-tbl{width:100%; border-collapse:collapse; font-size:14px}
.pf-tbl td{padding:7px 10px 7px 0; border-bottom:1px solid var(--line); vertical-align:top}
.pf-tbl td:first-child{font-family:var(--mono); font-size:12.5px; color:var(--faint); white-space:nowrap;
  font-variant-numeric:tabular-nums}
.pf-empty{color:var(--faint); font-size:14px; padding:40px 0; text-align:center}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(12,16,12,.55);
  display:flex; align-items:center; justify-content:center; padding:18px}
.modal-box{background:var(--surface); border:1px solid var(--line-strong); border-radius:14px;
  width:min(620px,100%); max-height:82vh; display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal-top{padding:16px 18px 12px; border-bottom:1px solid var(--line)}
.modal-top h3{font-family:var(--serif); font-size:18px; font-weight:700}
.modal-top p{font-size:13px; color:var(--muted); margin-top:4px}
.modal-box textarea{border-radius:0; border:0; border-bottom:1px solid var(--line); min-height:200px;
  flex:1 1 auto; font-family:var(--mono); font-size:12px; line-height:1.55; background:var(--surface-2)}
.modal-foot{padding:13px 18px; display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.modal-foot .msg{font-size:13px; color:var(--accent); margin-left:auto}

.foot{border-top:1px solid var(--line); padding-block:22px 34px; font-size:12.5px; color:var(--faint)}
.foot b{color:var(--muted); font-weight:500}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

@media print{
  .top,.steps,.foot,.no-print,.modal{display:none !important}
  body{background:#fff}
  .paper{border:0; box-shadow:none; padding:0; margin:0}
  .wrap{max-width:none; padding:0}
  .pf-sec{break-inside:avoid}
  .pf-item{break-inside:avoid}
}
</style>

</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="top-in">
      <span class="brand">포트폴리오 인터뷰</span>
      <span class="brand-sub">질문에 답하면 포트폴리오가 됩니다</span>
      <span class="count" id="count">0개 답함</span>
    </div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
</div>

<nav class="steps"><div class="wrap"><div class="steps-in" id="steps"></div></div></nav>

<main class="wrap" id="main"></main>

<footer class="foot wrap">
  <b>답은 이 브라우저에만 저장됩니다.</b> 서버로 가지 않고, 링크를 받은 다른 사람에게도 보이지 않습니다.
  대신 창을 지우거나 다른 기기에서 열면 사라지니, 다 쓰고 나면 마지막 화면에서 <b>답 백업하기</b>를 눌러 텍스트를 따로 보관하세요.
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-top"><h3 id="mTitle"></h3><p id="mDesc"></p></div>
    <textarea id="mText" spellcheck="false"></textarea>
    <div class="modal-foot">
      <button class="btn primary" id="mCopy">복사하기</button>
      <button class="btn" id="mApply" hidden>불러오기</button>
      <button class="btn ghost" id="mClose">닫기</button>
      <span class="msg" id="mMsg"></span>
    </div>
  </div>
</div>

<script>
/* ============================ 질문 ============================ */

const FIELDS = [
  {id:'none',   label:'아직 미정'},
  {id:'dev',    label:'개발·IT'},
  {id:'design', label:'디자인·영상'},
  {id:'mkt',    label:'기획·마케팅'},
  {id:'office', label:'사무·경영지원'},
  {id:'sales',  label:'영업·고객응대'},
  {id:'edu',    label:'교육'},
  {id:'npo',    label:'비영리·공공'},
  {id:'site',   label:'제조·현장'}
];

const BASIC = [
  {k:'name', t:'text', q:'이름이 어떻게 되나요?', ph:'김하람'},
  {k:'title', t:'text', q:'처음 만난 사람에게 나를 한 마디로 뭐라고 소개하나요?',
   hint:'직함이 아니어도 됩니다. 남이 듣고 바로 알아들을 말이면 됩니다.',
   ex:'카페 매니저 3년 / 영상 편집 2년, 주로 유튜브 / 전공은 화학, 지금은 데이터 공부 중',
   ph:'카페 매니저 3년, 지금은 마케팅 쪽으로 옮기는 중'},
  {k:'pitch', t:'area', q:'그 일을 하면서 나는 주로 무엇을 해결해 왔나요? 두세 문장으로.', rows:3,
   hint:'지금 못 쓰겠으면 비워 두세요. 뒤쪽 질문에 답하고 나면 쓸 말이 생깁니다.',
   ex:'사람이 자주 바뀌는 매장에서 일하는 방법을 문서로 남겨 왔습니다. 새로 온 사람이 혼자 물어보지 않고도 일할 수 있게 만드는 걸 좋아합니다.'},
  {k:'email', t:'text', q:'연락받을 이메일은?', ph:'haram@example.com'},
  {k:'phone', t:'text', q:'전화번호는? (공개하기 싫으면 비워 두세요)', ph:'010-0000-0000'},
  {k:'where', t:'text', q:'어디에서 일할 수 있나요?', ex:'서울·경기 / 재택 가능 / 부산, 이사 가능', ph:'서울·경기'},
  {k:'status', t:'choice', q:'지금 어떤 상태인가요?',
   opts:['재직 중','퇴사 후 구직 중','졸업 예정','경력 전환 준비 중','휴직·공백기','프리랜서']}
];

const EXP = [
  {k:'what', t:'text', q:'무슨 일이었나요? 한 줄로.',
   hint:'직함 말고, 실제로 무엇을 했는지 쓰세요.',
   ex:'직함: 홀 담당 → 실제로 한 일: 신입 교육을 맡아 매뉴얼을 만들었다',
   ph:'신입 직원 교육 매뉴얼 만들기'},
  {k:'org', t:'text', q:'어디에서 했나요?',
   hint:'회사, 학교, 동아리, 알바, 봉사, 혼자 한 것 — 전부 이력입니다.', ph:'○○카페 신촌점'},
  {k:'when', t:'text', q:'언제부터 언제까지?', ex:'2024.03 – 2025.08  /  2025년 여름 두 달', ph:'2024.03 – 2025.08'},
  {k:'why', t:'area', q:'어쩌다 그 일을 하게 됐나요? 그때 뭐가 문제였나요?', rows:3,
   hint:'"시켜서 했다"도 답입니다. 그럼 왜 하필 나한테 시켰을까요?',
   ex:'석 달에 한 번씩 사람이 바뀌는데, 가르치는 사람마다 말이 달라서 손님 응대가 제각각이었습니다.'},
  {k:'stuck', t:'area', q:'처음에 제일 안 풀렸던 게 뭐예요?', rows:2,
   hint:'막힌 지점을 말할 수 있는 사람이 일을 해 본 사람입니다.',
   ex:'글로 써 두면 아무도 안 읽었습니다.'},
  {k:'did', t:'area', q:'그래서 뭘 했나요? 한 줄에 하나씩, 세 가지만.', rows:4,
   hint:'줄을 바꿔 쓰면 포트폴리오에 항목으로 정리됩니다.',
   ex:'글 대신 사진 15장짜리 한 장 요약본으로 바꿨다\n음료 제조대 옆에 코팅해서 붙였다\n첫 주에는 옆에 붙어서 같이 만들게 했다'},
  {k:'result', t:'area', q:'끝나고 뭐가 달라졌나요?', rows:3,
   hint:'숫자가 있으면 숫자로. 없으면 "전에는 ~였는데 지금은 ~다" 로 쓰면 됩니다.',
   ex:'전에는 신입이 혼자 설 때까지 3주가 걸렸는데, 1주로 줄었습니다. 점장이 다른 두 지점에도 그대로 가져다 썼습니다.'},
  {k:'mine', t:'area', q:'그중 내가 한 몫은 어디까지인가요?', rows:2,

function qNode(q, get, set, n){
  const w = el('div','q');
  const head = el('div','q-head');
  if(n) head.appendChild(el('span','q-num', String(n).padStart(2,'0')));
  const lab = el('label','q-text', q.q);
  lab.htmlFor = 'f_' + Math.random().toString(36).slice(2,9);
  head.appendChild(lab);
  w.appendChild(head);

  const body = el('div','q-body');
  if(q.hint) body.appendChild(el('p','q-hint', q.hint));

  let input;
  if(q.t === 'choice'){
    input = el('div','chips');
    q.opts.forEach(o=>{
      const b = el('button','chip', o);
      b.type='button';
      b.setAttribute('aria-pressed', get()===o ? 'true':'false');
      b.onclick = ()=>{ set(get()===o ? '' : o); [...input.children].forEach(c=>c.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed', get()===o ? 'true':'false'); save(); tick(); };
      input.appendChild(b);
    });
  } else if(q.t === 'area'){
    input = el('textarea');
    input.rows = q.rows || 3;
    input.id = lab.htmlFor;
    if(q.ph) input.placeholder = q.ph;
    input.value = get() || '';
    input.oninput = ()=>{ set(input.value); save(); tick(); };
  } else {
    input = el('input');
    input.type='text'; input.id = lab.htmlFor;
    if(q.ph) input.placeholder = q.ph;
    input.value = get() || '';
    input.oninput = ()=>{ set(input.value); save(); tick(); };
  }
  body.appendChild(input);
  if(q.ex) body.appendChild(el('p','q-ex','예) ' + q.ex));
  w.appendChild(body);
  return w;
}

function listNode(arr, cols, addLabel, after){
  const box = el('div');
  const rows = el('div','rows');
  const draw = ()=>{
    rows.textContent = '';
    arr.forEach((item, i)=>{
      const r = el('div','row');
      cols.forEach(c=>{
        let f;
        if(c.t==='select'){
          f = el('select','narrow');
          f.appendChild(el('option','', c.ph || '정도'));
          f.firstChild.value = '';
          c.opts.forEach(o=>{ const op = el('option','',o); op.value=o; f.appendChild(op); });
          f.value = item[c.k] || '';
        } else {
          f = el('input', c.w || 'grow');
          f.type='text'; f.placeholder = c.ph || '';
          f.value = item[c.k] || '';
        }
        f.oninput = f.onchange = ()=>{ item[c.k] = f.value; save(); tick(); };
        r.appendChild(f);
      });
      const x = el('button','xbtn','×');
      x.type='button'; x.title='이 줄 지우기';
      x.onclick = ()=>{ arr.splice(i,1); draw(); save(); tick(); };
      r.appendChild(x);
      rows.appendChild(r);
    });
    if(!arr.length) rows.appendChild(el('p','q-hint','아직 없습니다. 아래 버튼으로 한 줄 추가하세요.'));
  };
  draw();
  box.appendChild(rows);
  const add = el('button','add','+ ' + addLabel);
  add.type='button';
  add.onclick = ()=>{ arr.push({}); draw(); save(); tick(); };
  box.appendChild(add);
  if(after) box.appendChild(after);
  return box;
}

function qPanel(defs, store, startAt){
  const p = el('div','panel');
  let n = startAt || 1;
  defs.forEach(q=>{
    p.appendChild(qNode(q, ()=>store[q.k], v=>{ store[q.k]=v; }, n++));
  });
  return p;
}

/* ============================ 포트폴리오 만들기 ============================ */

function valHTML(s){
  const L = lines(s);
  if(L.length > 1) return '<ul>' + L.map(x=>'<li>'+esc(x)+'</li>').join('') + '</ul>';
  return esc(L[0] || '');
}

function portfolioHTML(ver){
  const b = D.basic, p = D.person;
  const out = [];
  const anything = has(b.name) || D.exps.some(e=>has(e.what)) || Object.values(p).some(has);
  if(!anything) return '<p class="pf-empty">아직 답한 게 없습니다. 위쪽 “시작”부터 채워 보세요.<br>어떤 모습이 되는지 보려면 “시작” 화면의 <b>예시로 채워 보기</b>를 눌러 보세요.</p>';

  out.push('<h1 class="pf-name">' + esc(b.name || '이름') + '</h1>');
  if(has(b.title)) out.push('<p class="pf-intro">' + esc(b.title) + '</p>');
  if(has(b.pitch)) out.push('<p class="pf-intro" style="font-size:15px;color:var(--muted);margin-top:10px">' + esc(b.pitch) + '</p>');

  const meta = [];
  if(has(b.email)) meta.push('<span>' + esc(b.email) + '</span>');
  if(has(b.phone)) meta.push('<span>' + esc(b.phone) + '</span>');
  if(has(b.where)) meta.push('<span>' + esc(b.where) + '</span>');
  if(has(b.status)) meta.push('<span>' + esc(b.status) + '</span>');
  if(meta.length) out.push('<div class="pf-meta">' + meta.join('') + '</div>');

  // 해온 일
  const exps = D.exps.filter(e => has(e.what) || has(e.result));
  if(exps.length){
    out.push('<section class="pf-sec"><h2 class="pf-h">해온 일</h2>');
    exps.forEach(e=>{
      out.push('<div class="pf-item">');
      out.push('<h3 class="pf-title">' + esc(e.what || '(제목 없음)') + '</h3>');
      const when = [e.org, e.when].filter(has).join('  ·  ');
      if(when) out.push('<p class="pf-when">' + esc(when) + '</p>');
      const rows = [
        ['상황', [e.why, e.stuck].filter(has).join('\n')],
        ['한 일', e.did],
        ['결과', e.result],
        ['내 몫', e.mine],
        ['쓴 것', e.tools],
        ['다시 한다면', e.again],
        ['자료', e.proof]
      ].filter(r=>has(r[1]));
      rows.forEach(r=>{
        out.push('<div class="pf-block"><div class="pf-lab">' + r[0] + '</div><div class="pf-val">' + valHTML(r[1]) + '</div></div>');
      });
      out.push('</div>');
    });
    out.push('</section>');
  }

  // 분야 특화
  if(ver && SPEC[ver] && D.spec[ver]){
    const sv = D.spec[ver];
    const items = SPEC[ver].filter(q=>has(sv[q.k]));
    if(items.length){
      out.push('<section class="pf-sec"><h2 class="pf-h">' + esc(fname(ver)) + '</h2><div class="pf-defs">');
      items.forEach(q=>{
        out.push('<div class="pf-def"><dt>' + esc(specLab(ver, q)) + '</dt><dd>' + valHTML(sv[q.k]) + '</dd></div>');
      });
      out.push('</div></section>');
    }
  }

  // 사람
  const pm = [
    ['자주 부탁받는 일', p.askme],
    ['안 귀찮아하는 일', p.easy],
    ['중요하게 여기는 것', p.angry],
    ['최근 배운 것', p.learned],
    ['잘 굴러가는 자리', p.team]
  ].filter(r=>has(r[1]));
  if(pm.length || has(p.praise)){
    out.push('<section class="pf-sec"><h2 class="pf-h">같이 일하면</h2>');
    if(has(p.praise)) out.push('<blockquote class="pf-quote">' + esc(p.praise.trim().replace(/^["“]|["”]$/g,'')) + '</blockquote>');
    if(pm.length){
      out.push('<div class="pf-defs">');
      pm.forEach(r=> out.push('<div class="pf-def"><dt>' + r[0] + '</dt><dd>' + valHTML(r[1]) + '</dd></div>'));
      out.push('</div>');
    }
    out.push('</section>');
  }

  // 할 줄 아는 것
  const tools = D.tools.filter(t=>has(t.name));
  const certs = D.certs.filter(t=>has(t.name));
  const langs = D.langs.filter(t=>has(t.name));
  if(tools.length || certs.length || langs.length){
    out.push('<section class="pf-sec"><h2 class="pf-h">할 줄 아는 것</h2>');
    if(tools.length){
      out.push('<div class="pf-tools">' + tools.map(t=>
        '<span class="pf-tool">' + esc(t.name) + (has(t.level) ? '<small>' + esc(t.level) + '</small>' : '') + '</span>').join('') + '</div>');
    }
    const rest = [];
    if(certs.length) rest.push(['자격 · 교육', certs.map(c=> c.name + (has(c.when) ? ' (' + c.when + ')' : '')).join('\n')]);
    if(langs.length) rest.push(['외국어', langs.map(c=> c.name + (has(c.level) ? ' — ' + c.level : '')).join('\n')]);
    if(rest.length){
      out.push('<div class="pf-defs" style="margin-top:16px">');
      rest.forEach(r=> out.push('<div class="pf-def"><dt>' + r[0] + '</dt><dd>' + valHTML(r[1]) + '</dd></div>'));
      out.push('</div>');
    }
    out.push('</section>');
  }

  // 그 밖의 이력
  const sh = D.short.filter(s=> has(s.org) || has(s.role));
  if(sh.length){
    out.push('<section class="pf-sec"><h2 class="pf-h">그 밖의 이력</h2><table class="pf-tbl"><tbody>');
    sh.forEach(s=> out.push('<tr><td>' + esc(s.when||'') + '</td><td>' + esc(s.org||'') +
      (has(s.role) ? ' — ' + esc(s.role) : '') + '</td></tr>'));
    out.push('</tbody></table></section>');
  }

  return out.join('\n');
}

function portfolioText(ver){
  const b = D.basic, p = D.person, L = [];
  const push = (s)=> L.push(s == null ? '' : s);
  push(b.name || '이름');
  if(has(b.title)) push(b.title);
  if(has(b.pitch)) push(b.pitch);
  push([b.email, b.phone, b.where, b.status].filter(has).join(' · '));
  push('');

  const exps = D.exps.filter(e=> has(e.what) || has(e.result));
  if(exps.length){
    push('【 해온 일 】'); push('');
    exps.forEach(e=>{
      push('■ ' + (e.what || '(제목 없음)'));
      const when = [e.org, e.when].filter(has).join('  ·  ');
      if(when) push('   ' + when);
      const rows = [['상황',[e.why,e.stuck].filter(has).join(' ')],['한 일',e.did],['결과',e.result],
                    ['내 몫',e.mine],['쓴 것',e.tools],['다시 한다면',e.again],['자료',e.proof]].filter(r=>has(r[1]));
      rows.forEach(r=>{
        const ls = lines(r[1]);
        if(ls.length > 1){ push('   · ' + r[0]); ls.forEach(x=> push('       - ' + x)); }
        else push('   · ' + r[0] + ': ' + ls[0]);
      });
      push('');
    });
  }
  if(ver && SPEC[ver] && D.spec[ver]){
    const sv = D.spec[ver], items = SPEC[ver].filter(q=>has(sv[q.k]));
    if(items.length){
      push('【 ' + fname(ver) + ' 】'); push('');
      items.forEach(q=>{ push('■ ' + specLab(ver, q)); lines(sv[q.k]).forEach(x=> push('   ' + x)); push(''); });
    }
  }
  const pm = [['자주 부탁받는 일',p.askme],['안 귀찮아하는 일',p.easy],['중요하게 여기는 것',p.angry],
              ['최근 배운 것',p.learned],['잘 굴러가는 자리',p.team]].filter(r=>has(r[1]));
  if(pm.length || has(p.praise)){
    push('【 같이 일하면 】'); push('');
    if(has(p.praise)) push('   "' + p.praise.trim().replace(/^["“]|["”]$/g,'') + '"'), push('');
    pm.forEach(r=> push('   · ' + r[0] + ': ' + lines(r[1]).join(' / ')));
    push('');
  }
  const tools = D.tools.filter(t=>has(t.name));
  const certs = D.certs.filter(t=>has(t.name));
  const langs = D.langs.filter(t=>has(t.name));
  if(tools.length || certs.length || langs.length){
    push('【 할 줄 아는 것 】'); push('');
    if(tools.length) push('   도구: ' + tools.map(t=> t.name + (has(t.level)?' ('+t.level+')':'')).join(', '));
    if(certs.length) push('   자격·교육: ' + certs.map(c=> c.name + (has(c.when)?' ('+c.when+')':'')).join(', '));
    if(langs.length) push('   외국어: ' + langs.map(c=> c.name + (has(c.level)?' — '+c.level:'')).join(', '));
    push('');
  }
  const sh = D.short.filter(s=> has(s.org) || has(s.role));
  if(sh.length){
    push('【 그 밖의 이력 】'); push('');
    sh.forEach(s=> push('   ' + [s.when, s.org, s.role].filter(has).join('  ')));
  }
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ============================ 모달 ============================ */

const modal = document.getElementById('modal');
function openModal(title, desc, text, loadMode){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mDesc').textContent = desc;
  const ta = document.getElementById('mText');
  ta.value = text; ta.readOnly = !loadMode;
  ta.placeholder = loadMode ? '여기에 백업해 둔 내용을 붙여 넣으세요' : '';
  document.getElementById('mApply').hidden = !loadMode;
  document.getElementById('mCopy').hidden = !!loadMode;
  document.getElementById('mMsg').textContent = '';
  modal.hidden = false;
  if(!loadMode){ ta.focus(); ta.select(); } else ta.focus();
}
document.getElementById('mClose').onclick = ()=>{ modal.hidden = true; };
modal.onclick = e => { if(e.target === modal) modal.hidden = true; };
document.addEventListener('keydown', e => { if(e.key === 'Escape') modal.hidden = true; });
document.getElementById('mCopy').onclick = async ()=>{
  const ta = document.getElementById('mText'), msg = document.getElementById('mMsg');
  ta.select();
  let ok = false;
  try{ await navigator.clipboard.writeText(ta.value); ok = true; }
  catch(e){ try{ ok = document.execCommand('copy'); }catch(e2){} }
  msg.textContent = ok ? '복사했습니다.' : '복사가 막혀 있습니다 — 위 내용을 직접 선택해 복사하세요.';
};
document.getElementById('mApply').onclick = ()=>{
  const ta = document.getElementById('mText'), msg = document.getElementById('mMsg');
  try{
    const obj = JSON.parse(ta.value);
    if(!obj || typeof obj !== 'object') throw 0;
    D = Object.assign(blank(), obj);
    save(); modal.hidden = true; cur = 'out'; render();
  }catch(e){ msg.textContent = '읽을 수 없는 내용입니다. 백업한 전체를 빠짐없이 붙여 넣었는지 확인하세요.'; }
};

/* ============================ 진행도 ============================ */

function counts(){
  let total = 0, done = 0;
  const add = (v)=>{ total++; if(has(v)) done++; };
  BASIC.forEach(q=> add(D.basic[q.k]));
  D.exps.forEach(e=> EXP.forEach(q=> add(e[q.k])));
  PERSON.forEach(q=> add(D.person[q.k]));
  total += 3;
  if(D.tools.some(t=>has(t.name))) done++;
  if(D.certs.some(t=>has(t.name))) done++;
  if(D.langs.some(t=>has(t.name))) done++;
  chosen().forEach(id=> SPEC[id].forEach(q=> add((D.spec[id]||{})[q.k])));
  return {total, done};
}

function secDone(id){
  const any = arr => arr.some(has);
  if(id === 'field')  return D.fields.length && D.fields[0] !== 'none' ? 1 : 0;
  if(id === 'basic')  return any(BASIC.map(q=>D.basic[q.k])) ? 1 : 0;
  if(id === 'exp')    return D.exps.some(e=>has(e.what)) ? 1 : 0;
  if(id === 'person') return any(PERSON.map(q=>D.person[q.k])) ? 1 : 0;
  if(id === 'skill')  return (D.tools.concat(D.certs, D.langs)).some(t=>has(t.name)) ? 1 : 0;
  if(id === 'spec')   return chosen().some(f=> SPEC[f].some(q=> has((D.spec[f]||{})[q.k]))) ? 1 : 0;
  return 0;
}

function tick(){
  const {total, done} = counts();
  document.getElementById('count').textContent = done + ' / ' + total + '개 답함';
  document.getElementById('barfill').style.width = (total ? Math.round(done/total*100) : 0) + '%';
  [...document.querySelectorAll('.step')].forEach(s=> s.dataset.done = secDone(s.dataset.id));
}

/* ============================ 그리기 ============================ */

function render(){
  const nav = document.getElementById('steps');
  nav.textContent = '';
  SECTIONS.forEach(s=>{
    const b = el('button','step'); b.type='button'; b.dataset.id = s.id;
    b.appendChild(el('span','dot'));
    b.appendChild(el('span','', s.kicker === '시작' || s.kicker === '완성' ? s.title : s.kicker + '. ' + s.title));
    if(s.id === cur) b.setAttribute('aria-current','true');
    b.onclick = ()=>{ cur = s.id; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    nav.appendChild(b);
  });

  const s = SECTIONS.find(x=>x.id === cur);
  const main = document.getElementById('main');
  main.textContent = '';
  const head = el('div','sec-head');
  head.appendChild(el('div','sec-kicker', s.kicker === '시작' || s.kicker === '완성' ? s.kicker : s.kicker + ' / 5'));
  head.appendChild(el('h2','sec-title', s.title));
  head.appendChild(el('p','sec-lede', s.lede));
  main.appendChild(head);
  main.appendChild(build[cur]());

  const i = SECTIONS.findIndex(x=>x.id === cur);
  const row = el('div','navrow no-print');
  if(i > 0){
    const b = el('button','btn','← ' + SECTIONS[i-1].title); b.type='button';
    b.onclick = ()=>{ cur = SECTIONS[i-1].id; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    row.appendChild(b);
  }
  if(i < SECTIONS.length - 1){
    const b = el('button','btn primary right', SECTIONS[i+1].title + ' →'); b.type='button';
    b.onclick = ()=>{ cur = SECTIONS[i+1].id; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    row.appendChild(b);
  }
  main.appendChild(row);
  tick();

  const active = nav.querySelector('[aria-current="true"]');
  if(active) active.scrollIntoView({block:'nearest', inline:'center'});
}

if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({D, cur}));
  window.claude.hot.ready(st=>{ if(st && st.D){ D = Object.assign(blank(), st.D); cur = st.cur || 'field'; } render(); });
} else {
  render();
}
